plugins { id 'com.android.application' }

android {
    namespace 'com.electrosandy.app'
    compileSdk 35
    defaultConfig {
        // Separate install so the existing app and its local data remain untouched.
        applicationId 'com.electrosandy.app.fresh'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '23.0'
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.biometric:biometric:1.1.0'
}
