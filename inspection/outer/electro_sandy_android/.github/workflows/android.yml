name: Build ELECTRO Sandy APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare app web assets from V17 archive
        run: |
          mkdir -p app/src/main/assets/www
          unzip -o ELECTRO_Sandy_V17_Development.zip -d /tmp/electro-v17
          cp /tmp/electro-v17/index.html app/src/main/assets/www/index.html
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-V17-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
