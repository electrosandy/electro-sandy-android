name: Android Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - inspect-project-zip

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Android project
        shell: bash
        run: |
          if [ -f inspection/outer/electro_sandy_android/settings.gradle ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/inspection/outer/electro_sandy_android" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project directory not found"
            exit 1
          fi

      - name: Run cash accounting regression tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          node --test tests/cash-accounting.test.cjs tests/financial-regression.test.cjs

      - name: Static JavaScript and DOM integrity tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          node --test tests/static-validation.test.cjs

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK for emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-Emulator-APK
          path: inspection/outer/electro_sandy_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare emulator smoke script
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/emulator-smoke.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/inspection/outer/electro_sandy_android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Using APK: $APK"
          ls -lh "$APK"
          PACKAGE="com.electrosandy.app.fresh"
          mkdir -p "$GITHUB_WORKSPACE/emulator-results"
          capture_failure() {
            code=$?
            echo "SMOKE_EXIT_CODE=$code" > "$GITHUB_WORKSPACE/emulator-results/result.txt"
            timeout 15s adb logcat -d -v time > "$GITHUB_WORKSPACE/emulator-results/logcat-on-failure.txt" 2>&1 || true
            timeout 15s adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/emulator-results/activities-on-failure.txt" 2>&1 || true
            timeout 15s adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/screen-on-failure.png" 2>/dev/null || true
            exit "$code"
          }
          trap capture_failure ERR
          test -s "$APK"
          adb wait-for-device
          booted=0
          for attempt in $(seq 1 90); do
            if timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android emulator did not finish booting within 3 minutes"
            exit 1
          fi
          adb logcat -c
          timeout 90s adb install -r "$APK"
          timeout 20s adb shell am force-stop "$PACKAGE"
          timeout 30s adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 20
          timeout 20s adb shell pidof "$PACKAGE" > "$GITHUB_WORKSPACE/emulator-results/app-pid.txt"
          test -s "$GITHUB_WORKSPACE/emulator-results/app-pid.txt"
          timeout 20s adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/emulator-results/activities.txt"
          timeout 20s adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/launch-screen.png"
          adb logcat -d -v time > "$GITHUB_WORKSPACE/emulator-results/logcat.txt"
          if grep -E "FATAL EXCEPTION|Process: ${PACKAGE}" "$GITHUB_WORKSPACE/emulator-results/logcat.txt"; then
            echo "Fatal Android crash detected"
            exit 1
          fi
          echo "EMULATOR_SMOKE_RESULT=PASS" | tee "$GITHUB_WORKSPACE/emulator-results/result.txt"
          BASH
          chmod +x "$GITHUB_WORKSPACE/emulator-smoke.sh"

      - name: Boot emulator, install app and run launch checks
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash "$GITHUB_WORKSPACE/emulator-smoke.sh"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-Emulator-Smoke-Evidence
          path: emulator-results/
          if-no-files-found: warn
