name: Android Emulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Android project
        shell: bash
        run: |
          if [ -f inspection/outer/electro_sandy_android/settings.gradle ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/inspection/outer/electro_sandy_android" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project directory not found"
            exit 1
          fi

      - name: Run cash accounting regression tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          node --test tests/cash-accounting.test.cjs

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Boot emulator, install app and run launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.electrosandy.app.fresh"
            mkdir -p "$GITHUB_WORKSPACE/emulator-results"

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb logcat -c
            adb install -r "$APK"
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 20

            adb shell pidof "$PACKAGE" > "$GITHUB_WORKSPACE/emulator-results/app-pid.txt"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/emulator-results/activities.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator-results/launch-screen.png"
            adb shell uiautomator dump /sdcard/electro-window.xml >/dev/null
            adb pull /sdcard/electro-window.xml "$GITHUB_WORKSPACE/emulator-results/window.xml"

            adb logcat -d -v time > "$GITHUB_WORKSPACE/emulator-results/logcat.txt"
            if grep -E "FATAL EXCEPTION|Process: ${PACKAGE}" "$GITHUB_WORKSPACE/emulator-results/logcat.txt"; then
              echo "Fatal Android crash detected"
              exit 1
            fi

            grep -E "mResumedActivity|ResumedActivity" "$GITHUB_WORKSPACE/emulator-results/activities.txt" || true
            echo "EMULATOR_SMOKE_RESULT=PASS" | tee "$GITHUB_WORKSPACE/emulator-results/result.txt"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-Emulator-Smoke-Evidence
          path: emulator-results/
          if-no-files-found: warn
