name: Extract project ZIP for inspection

on:
  push:
    branches:
      - inspect-project-zip
    paths:
      - .github/workflows/unpack-project-for-inspection.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@v4
        with:
          ref: inspect-project-zip
      - name: Extract project archives
        run: |
          set -e
          mkdir -p inspection/outer inspection/development_zip_contents
          unzip -q electro_sandy_android_fixed.zip -d inspection/outer
          INNER="$(find inspection/outer -type f -name 'ELECTRO_Sandy_V17_Development.zip' -print -quit)"
          if [ -n "$INNER" ]; then
            unzip -q "$INNER" -d inspection/development_zip_contents
          fi
          echo "Extracted files:"
          find inspection -type f | sort
      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection
          if ! git diff --cached --quiet; then
            git commit -m "Extract project archives for source inspection"
            git push origin inspect-project-zip
          fi
