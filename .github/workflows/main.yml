name: Build ELECTRO Sandy Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project layout
        run: |
          test -f settings.gradle
          test -f app/src/main/assets/www/index.html
          test -f app/google-services.json

      - name: Run regression tests
        run: |
          node --test tests/cash-accounting.test.cjs tests/financial-regression.test.cjs tests/static-validation.test.cjs tests/cloud-sync.test.cjs

      - name: Set up Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firestore test tools
        run: |
          npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1
          npm install --global firebase-tools@14.12.0

      - name: Test Firestore security rules in emulator
        run: |
          firebase emulators:exec --only firestore --project demo-electro-sandy "node --test tests/firestore-rules.test.cjs"

      - name: Set up JDK 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: electro-sandy-android-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-V30-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
