
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - inspect-project-zip
    paths:
      - 'inspection/outer/electro_sandy_android/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Android project source
        run: |
          if [ -f inspection/outer/electro_sandy_android/settings.gradle ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/inspection/outer/electro_sandy_android" >> "$GITHUB_ENV"
          else
            mkdir -p project
            unzip -o electro_sandy_android_fixed.zip -d project
            GRADLE_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then echo "ERROR: Gradle project not found"; exit 1; fi
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
          fi
          echo "Checking Android assets:"
          find "$PROJECT_DIR" -path "*/assets/www/index.html"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
