
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Updated ZIP
        run: |
          mkdir project
          unzip -o electro_sandy_android_fixed.zip -d project
          echo "Project files:"
          find project -name settings.gradle -o -name settings.gradle.kts
          echo "Checking Android assets:"
          find project -path "*/assets/www/index.html"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          GRADLE_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
