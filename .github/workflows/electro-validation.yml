name: ELECTRO Sandy Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android project
        run: echo "PROJECT_DIR=$GITHUB_WORKSPACE/inspection/outer/electro_sandy_android" >> "$GITHUB_ENV"
      - name: Accounting regression tests
        run: |
          cd "$PROJECT_DIR"
          node --test tests/cash-accounting.test.cjs
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.electrosandy.app.fresh"
            mkdir -p validation-results
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb logcat -c
            adb install -r "$APK"
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof "$PACKAGE" | tee validation-results/app-pid.txt
            adb shell dumpsys activity activities > validation-results/activities.txt
            adb exec-out screencap -p > validation-results/launch-screen.png
            adb shell uiautomator dump /sdcard/electro-window.xml >/dev/null
            adb pull /sdcard/electro-window.xml validation-results/window.xml
            adb logcat -d -v time > validation-results/logcat.txt
            if grep -E "FATAL EXCEPTION|Process: ${PACKAGE}" validation-results/logcat.txt; then
              echo "Fatal Android crash detected"
              exit 1
            fi
            echo "EMULATOR_LAUNCH_PASS" > validation-results/result.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRO-Sandy-Validation-Evidence
          path: validation-results/
          if-no-files-found: warn
